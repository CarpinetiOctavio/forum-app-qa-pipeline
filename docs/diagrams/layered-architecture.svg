<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="Helvetica, Arial, sans-serif">
    <rect width="640" height="600" fill="#ffffff"/>

    <!-- Frontend -->
    <rect x="80" y="20" width="480" height="80" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="320" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Frontend — React Components</text>
    <text x="320" y="72" text-anchor="middle" font-size="11" fill="#4338ca">Login, PostList, PostDetail, CreatePost, CommentList, CommentForm</text>

    <line x1="320" y1="100" x2="320" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- API Layer -->
    <rect x="80" y="130" width="480" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="320" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">API Layer — Handlers</text>
    <text x="320" y="174" text-anchor="middle" font-size="11" fill="#374151">post_handler.go, auth_handler.go — maps HTTP ↔ Service, no logic</text>
    <text x="320" y="190" text-anchor="middle" font-size="11" fill="#374151">not coverage-measured — thin HTTP↔Service mapping, no business logic to test</text>

    <line x1="320" y1="200" x2="320" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Business Logic -->
    <rect x="80" y="230" width="480" height="80" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="320" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Business Logic — Services</text>
    <text x="320" y="274" text-anchor="middle" font-size="11" fill="#065f46">NewAuthService(userRepo), NewPostService(postRepo, userRepo)</text>
    <text x="320" y="290" text-anchor="middle" font-size="11" fill="#065f46">coverage-measured; repository mocked in these tests</text>

    <line x1="320" y1="310" x2="320" y2="340" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Data Access -->
    <rect x="80" y="340" width="480" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="320" y="366" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Data Access — Repository</text>
    <text x="320" y="384" text-anchor="middle" font-size="11" fill="#374151">NewSQLiteUserRepository(db), NewSQLitePostRepository(db)</text>
    <text x="320" y="400" text-anchor="middle" font-size="11" fill="#374151">not coverage-measured — mocked by every service-layer test</text>

    <line x1="320" y1="410" x2="320" y2="440" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Database -->
    <rect x="80" y="440" width="480" height="95" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="320" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Database — SQLite (backend/database.db)</text>
    <text x="320" y="484" text-anchor="middle" font-size="11" fill="#1d4ed8">users · posts · comments — created via InitDB("./database.db")</text>
    <text x="320" y="500" text-anchor="middle" font-size="11" fill="#1d4ed8">posts.user_id, comments.post_id, comments.user_id — all ON DELETE CASCADE</text>
    <text x="320" y="516" text-anchor="middle" font-size="11" fill="#1d4ed8">deleting a user cascades to their posts, then to comments on those posts</text>

    <!-- Legend / footer -->
    <rect x="80" y="560" width="14" height="14" fill="#ecfdf5" stroke="#047857"/>
    <text x="102" y="571" font-size="11" fill="#374151">coverage-measured (services/components)</text>
    <rect x="80" y="582" width="14" height="14" fill="#f3f4f6" stroke="#374151"/>
    <text x="102" y="593" font-size="11" fill="#374151">not measured — thin mapping, mocked, or schema-level</text>

    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
        </marker>
    </defs>
</svg>