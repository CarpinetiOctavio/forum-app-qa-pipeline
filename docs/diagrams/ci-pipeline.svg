<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" font-family="Helvetica, Arial, sans-serif">
    <rect width="680" height="540" fill="#ffffff"/>

    <!-- Trigger -->
    <rect x="270" y="40" width="140" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="340" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Push / PR</text>

    <line x1="316" y1="84" x2="200" y2="144" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="364" y1="84" x2="480" y2="144" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Tests -->
    <rect x="70" y="144" width="260" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="200" y="167" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Backend Tests (Go)</text>
    <text x="200" y="187" text-anchor="middle" font-size="11" fill="#1d4ed8">go test + 70% gate</text>

    <rect x="350" y="144" width="260" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="480" y="167" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Frontend Tests (React)</text>
    <text x="480" y="187" text-anchor="middle" font-size="11" fill="#1d4ed8">jest + 70% gate</text>

    <line x1="200" y1="200" x2="200" y2="260" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="480" y1="200" x2="480" y2="260" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Parallel group container -->
    <rect x="30" y="260" width="620" height="116" rx="12" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="46" y="282" font-size="11" fill="#4b5563">runs in parallel, after tests pass</text>

    <rect x="46" y="300" width="135" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="113" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Backend build</text>
    <text x="113" y="341" text-anchor="middle" font-size="10.5" fill="#065f46">go build</text>

    <rect x="197" y="300" width="135" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="264" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Frontend build</text>
    <text x="264" y="341" text-anchor="middle" font-size="10.5" fill="#065f46">npm run build</text>

    <rect x="348" y="300" width="135" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="415" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">SonarCloud</text>
    <text x="415" y="341" text-anchor="middle" font-size="10.5" fill="#065f46">static analysis</text>

    <rect x="499" y="300" width="135" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="566" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Cypress E2E</text>
    <text x="566" y="341" text-anchor="middle" font-size="10.5" fill="#065f46">mocked + 1 real</text>

    <line x1="340" y1="376" x2="340" y2="416" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Summary -->
    <rect x="230" y="416" width="220" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="340" y="442" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Test Summary</text>

    <!-- Cross-references -->
    <text x="40" y="500" font-size="11" fill="#4b5563">trigger detail &#8594; ci-testing/branching-model.svg</text>
    <text x="40" y="518" font-size="11" fill="#4b5563">adds SonarCloud + Cypress vs. ci-testing/ci-pipeline-flow.svg</text>

    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
        </marker>
    </defs>
</svg>