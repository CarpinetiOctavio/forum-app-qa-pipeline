<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" font-family="Helvetica, Arial, sans-serif">
    <rect width="680" height="424" fill="#ffffff"/>

    <line x1="330" y1="88" x2="350" y2="88" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="70" y="60" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="200" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Summary job</text>
    <text x="200" y="103" text-anchor="middle" font-size="11" fill="#374151">ignored real results</text>

    <rect x="350" y="60" width="260" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="480" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">if: always(), no real needs</text>
    <text x="480" y="103" text-anchor="middle" font-size="11" fill="#b91c1c">never actually checked</text>

    <line x1="330" y1="174" x2="350" y2="174" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="70" y="146" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="200" y="169" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Ruleset with one check</text>
    <text x="200" y="189" text-anchor="middle" font-size="11" fill="#374151">new jobs don't block anything</text>

    <rect x="350" y="146" width="260" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="480" y="169" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">A job could fail anyway</text>
    <text x="480" y="189" text-anchor="middle" font-size="11" fill="#b91c1c">the merge went through</text>

    <line x1="330" y1="260" x2="350" y2="260" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="70" y="232" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="200" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Pipeline only ran on PRs</text>
    <text x="200" y="275" text-anchor="middle" font-size="11" fill="#374151">never on push to main/staging</text>

    <rect x="350" y="232" width="260" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="480" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Merges were never analyzed</text>
    <text x="480" y="275" text-anchor="middle" font-size="11" fill="#b91c1c">SonarCloud saw stale data</text>

    <rect x="70" y="338" width="540" height="56" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="340" y="361" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">The common thread</text>
    <text x="340" y="381" text-anchor="middle" font-size="11" fill="#6d28d9">a gate no one had actually verified</text>

    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
        </marker>
    </defs>
</svg>