sonar.projectKey=CarpinetiOctavio_forum-app-qa-pipeline2
sonar.organization=carpinetioctavio

# sonar.sources was left undeclared on the assumption that the scanner
# defaults it to "." (the whole repo) when unset, per SonarScanner CLI's own
# documentation. In practice, combined with sonar.tests being set, that
# default did not hold: the real CI log's "Preprocessing files..." step --
# which runs before any inclusion/exclusion pattern is applied ("0 files
# ignored because of inclusion/exclusion patterns" logged immediately after
# it) -- found only 4 files in the entire repo, all under backend/tests/.
# That rules out sonar.coverage.exclusions or sonar.tests as the cause: the
# file-discovery step itself, prior to any exclusion, was already scoped to
# almost nothing. The exact mechanism behind that interaction isn't
# documented clearly even in Sonar's own community discussions, so rather
# than chase it further, sources are declared explicitly here to remove the
# ambiguity regardless of what the undeclared-default actually resolves to.
#
# "frontend", not "frontend/src": frontend/cypress/** must still receive
# general code-quality analysis (duplication, code smells, security rules).
# It's excluded from coverage measurement specifically -- see
# sonar.coverage.exclusions below and ADR-001's Consequences -- which is a
# narrower exclusion than removing it from analysis altogether.
sonar.sources=backend,frontend

# SonarGo, unlike SonarJS, doesn't auto-recognize _test.go as test code --
# without this, every line in a Go test file counts as "needs coverage" and
# is reported 0% covered (nothing in coverage.out ever instruments a test
# file itself), which is what was actually driving Coverage on New Code
# down, not undertested application code.
#
# sonar.tests=backend (the original value here) was a scope bug, not a
# fine-tuning gap: with sonar.sources never declared, marking the whole
# backend/ tree as the tests root pulled backend/internal/ and backend/cmd/
# into that root too. Neither matched sonar.test.inclusions below, so they
# were classified as neither source nor test -- invisible to analysis.
# Confirmed directly: SonarCloud was analyzing exactly 2 files in the
# entire project (the two backend/tests/services/*_test.go files), nothing
# else in backend/ or frontend/, no project-level ncloc/coverage at all.
# Scoped down to backend/tests specifically -- the actual directory real
# tests and mocks live in -- so backend/internal/ and backend/cmd/ never
# enter the tests root and fall back to normal source analysis.
# sonar.test.inclusions covers all of backend/tests/**, not just the
# *_test.go files: backend/tests/mocks/*.go doesn't match a *_test.go
# pattern, and narrowing inclusions to only *_test.go would silently
# orphan the mocks the same way internal/ and cmd/ were orphaned above --
# same bug, smaller blast radius. Mocks are test doubles either way (see
# ADR-001's tests/mocks/ coverage-exclusion row), so classifying them as
# test-role code here is consistent, not just a workaround.
#
# The same class of bug turned up a third time after sonar.sources was
# declared explicitly: real analysis of frontend/ (never possible before)
# showed .test.tsx/.test.ts/.cy.ts files with real new_lines_to_cover and
# 0% coverage -- ADR-002's "SonarJS auto-recognizes .test.tsx" claim had
# never actually been checked against a real analysis of this repo, since
# no frontend file had ever been indexed until sonar.sources was fixed.
#
# First attempt at this fix widened sonar.test.inclusions only, leaving
# sonar.tests at backend/tests -- on the assumption that test.inclusions
# was an independent inclusion mechanism. It isn't: the real CI log showed
# those 9 frontend test/spec files got excluded from sources (per the
# inclusions pattern) but never actually indexed as tests either, since
# none of their paths fell under any sonar.tests root. Confirmed via
# SonarCloud's components/tree API -- 64 files indexed dropped to 55, and
# none of the 9 excluded files appeared anywhere in the tree, not even
# with a UTS (test) qualifier the way backend/tests/*_test.go files do.
# sonar.test.inclusions only disambiguates by pattern *within* a root
# already declared in sonar.tests -- it doesn't grant test status on its
# own to a path sonar.tests doesn't cover.
#
# Fix: declare frontend/src in both sonar.sources (already there) and
# sonar.tests, letting sonar.test.inclusions' patterns pick the *.test.ts/
# *.test.tsx files out of that shared root while everything else in
# frontend/src still resolves as source -- the standard SonarSource
# pattern for a directory where source and tests are colocated, confirmed
# against a public reference project using the same
# sonar.sources=X + sonar.tests=Y,X shape. frontend/cypress/e2e is added
# to sonar.tests too, but as a root of its own, not an overlap: unlike
# frontend/src, it holds nothing but Cypress specs, the same shape as
# backend/tests.
sonar.tests=backend/tests,frontend/src,frontend/cypress/e2e
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/cypress/e2e/**/*.cy.ts

# Coverage exclusions mirror ADR-001's exclusion list exactly -- same layers
# excluded from the go test / Jest coverage gate, so SonarCloud's coverage
# figure and the pipeline's own gate agree on what "coverage" means here.
sonar.coverage.exclusions=\
  backend/internal/handlers/**,\
  backend/internal/repository/**,\
  backend/internal/router/**,\
  backend/internal/database/**,\
  backend/internal/models/**,\
  backend/cmd/**,\
  backend/tests/mocks/**,\
  frontend/src/App.tsx,\
  frontend/src/index.tsx,\
  frontend/src/reportWebVitals.ts,\
  frontend/src/types/**,\
  frontend/src/__mocks__/**,\
  frontend/cypress/support/**

# frontend/cypress/support/** is not part of the ADR-001 mirror above -- it's
# not in Jest's collectCoverageFrom scope at all, so there's no coverage-gate
# figure to mirror. Excluded here for a different, tooling-limitation reason;
# see ADR-001's Consequences for the justification and its known-gap status.

# Generated coverage report artifacts, not source -- excluded from copy-paste
# detection so machine-generated report files don't produce false positives.
sonar.cpd.exclusions=backend/coverage.out,frontend/coverage/**

# Reads the same coverage.out / lcov.info artifacts backend-tests and
# frontend-tests already produce (see ADR-002) -- downloaded as job artifacts
# by the sonarcloud CI job before this scan runs.
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
