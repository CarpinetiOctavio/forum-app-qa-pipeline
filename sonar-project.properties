sonar.projectKey=CarpinetiOctavio_forum-app-qa-pipeline2
sonar.organization=carpinetioctavio

# SonarGo, unlike SonarJS, doesn't auto-recognize _test.go as test code --
# without this, every line in a Go test file counts as "needs coverage" and
# is reported 0% covered (nothing in coverage.out ever instruments a test
# file itself), which is what was actually driving Coverage on New Code
# down, not undertested application code. Scoped to backend/ specifically,
# not the docs' generic `sonar.tests=.` example, because this repo mixes
# .tsx/.test.tsx in the same frontend directories -- exactly the mixed-tree
# case Sonar's own docs flag as needing narrower scoping. Frontend's test
# files already excluded correctly via SonarJS's own auto-detection, with
# no sonar.tests config at all -- checked again after this change lands,
# not assumed to still hold just because the scope says backend/.
sonar.tests=backend
sonar.test.inclusions=backend/**/*_test.go

# Coverage exclusions mirror ADR-001's exclusion list exactly -- same layers
# excluded from the go test / Jest coverage gate, so SonarCloud's coverage
# figure and the pipeline's own gate agree on what "coverage" means here.
sonar.coverage.exclusions=\
  backend/internal/handlers/**,\
  backend/internal/repository/**,\
  backend/internal/router/**,\
  backend/internal/database/**,\
  backend/internal/models/**,\
  backend/cmd/**,\
  backend/tests/mocks/**,\
  frontend/src/App.tsx,\
  frontend/src/index.tsx,\
  frontend/src/reportWebVitals.ts,\
  frontend/src/types/**,\
  frontend/src/__mocks__/**,\
  frontend/cypress/support/**

# frontend/cypress/support/** is not part of the ADR-001 mirror above -- it's
# not in Jest's collectCoverageFrom scope at all, so there's no coverage-gate
# figure to mirror. Excluded here for a different, tooling-limitation reason;
# see ADR-001's Consequences for the justification and its known-gap status.

# Generated coverage report artifacts, not source -- excluded from copy-paste
# detection so machine-generated report files don't produce false positives.
sonar.cpd.exclusions=backend/coverage.out,frontend/coverage/**

# Reads the same coverage.out / lcov.info artifacts backend-tests and
# frontend-tests already produce (see ADR-002) -- downloaded as job artifacts
# by the sonarcloud CI job before this scan runs.
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
